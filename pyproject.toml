[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stealth-phase1"
version = "0.1.0"
description = "Multispectral stealth material discovery pipeline (radar + IR + visible)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
# #1 dataset (Tier A) ingestion + #3 predictor training (run on the pod)
data = ["jarvis-tools>=2024.1.1"]
train = ["jarvis-tools>=2024.1.1", "scikit-learn>=1.3", "lightgbm>=4.0", "joblib>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
