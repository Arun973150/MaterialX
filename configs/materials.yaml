# Candidate materials for the multispectral stealth stack, one entry per material/state.
#
# source: refractiveindex  -> wavelength-resolved n,k pulled from refractiveindex.info
#                            (keys verified against the local DB) via the `refractiveindex` pkg.
# source: literature       -> documented scalar/constant values with citation (used when the
#                            material isn't in refractiveindex.info, e.g. MXene, PDMS).
#
# layer_role values: visible_ec | ir_thermochromic | dielectric_spacer | radar_conductor
#                    | substrate | ground

materials:
  # ---- IR layer: thermochromic VO2 (both phases — the emissivity switch) ----
  - name: "VO2 (insulating, <Tc)"
    layer_role: ir_thermochromic
    state: insulating
    source: refractiveindex
    ri: {shelf: main, book: VO2, page: Beaini-25C}
    properties: {transition_temp_C: 68, role: "low-LWIR-emissivity state"}
    provenance: "Beaini et al. (VO2, 25 C) via refractiveindex.info; range 0.50-25 um"

  - name: "VO2 (metallic, >Tc)"
    layer_role: ir_thermochromic
    state: metallic
    source: refractiveindex
    ri: {shelf: main, book: VO2, page: Beaini-100C}
    properties: {transition_temp_C: 68, role: "high-LWIR-emissivity/loss state"}
    provenance: "Beaini et al. (VO2, 100 C) via refractiveindex.info; range 0.50-25 um"

  # ---- Visible layer: electrochromic / conductive polymer ----
  - name: "PEDOT:PSS"
    layer_role: visible_ec
    source: refractiveindex
    ri: {shelf: other, book: PEDOT-PSS, page: Chen}
    properties: {role: "electrochromic visible switching", note: "ProDOT polymers are the spec target; PEDOT:PSS is the in-DB representative"}
    provenance: "Chen (PEDOT:PSS) via refractiveindex.info; range 0.30-1.10 um"

  # ---- Radar conductors ----
  - name: "ITO"
    layer_role: radar_conductor
    source: refractiveindex
    ri: {shelf: other, book: In2O3-SnO2, page: Konig}
    properties: {sheet_resistance_ohm_sq: 10.0, conductivity_S_per_cm: 5000.0, role: "tunable transparent conductor (also visible/NIR)"}
    provenance: "Konig (In2O3:SnO2 / ITO) via refractiveindex.info; range 0.25-1.00 um"

  - name: "MXene Ti3C2Tx"
    layer_role: radar_conductor
    source: literature
    properties: {conductivity_S_per_cm: 10000.0, sheet_resistance_ohm_sq: 1.5, role: "primary broadband microwave absorber"}
    provenance: "Ti3C2Tx conductivity ~10,000-15,000 S/cm (Drexel MXene literature); optical n,k specialized — not in refractiveindex.info"

  # ---- Dielectric spacers (impedance matching for radar) ----
  - name: "SiO2 (IR dielectric)"
    layer_role: dielectric_spacer
    source: refractiveindex
    ri: {shelf: main, book: SiO2, page: Kischkat}
    properties: {eps_r_microwave: 3.9, role: "low-loss IR/RF dielectric spacer"}
    provenance: "Kischkat (SiO2) via refractiveindex.info; range 1.54-14.29 um"

  - name: "FR4 (RF dielectric, baseline)"
    layer_role: dielectric_spacer
    source: literature
    properties: {eps_r_microwave: 4.3, loss_tangent: 0.025, role: "baseline RF dielectric (used in DRDO FSS paper)"}
    provenance: "FR4 eps_r~4.3, tan(d)~0.025; standard PCB laminate"

  # ---- Ground plane ----
  - name: "Aluminum (ground plane)"
    layer_role: ground
    source: refractiveindex
    ri: {shelf: main, book: Al, page: Ordal}
    properties: {conductivity_S_per_cm: 377000.0, role: "broadband reflective backing"}
    provenance: "Ordal (Al) via refractiveindex.info; range 0.67-200 um"

  # ---- Substrate ----
  - name: "PDMS (flexible substrate)"
    layer_role: substrate
    source: literature
    literature_nk: {n: 1.40, k: 0.0}
    properties: {eps_r_microwave: 2.7, density_g_cm3: 0.97, role: "flexible conformable substrate"}
    provenance: "PDMS (Sylgard 184): n~1.40 visible-NIR, eps_r~2.7 @ GHz; literature — not in refractiveindex.info"
